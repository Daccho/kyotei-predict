[project]
name = "kyotei-ml"
version = "0.1.0"
description = "Kyotei (boat racing) calibrated-probability model for positive-EV betting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "lhafile>=0.3.0",         # pure-Python LZH decode (no system lhasa dependency)
    "lightgbm>=4.3",          # Phase 3+
    "scikit-learn>=1.4",      # calibration curves / Brier (Phase 3+)
    "matplotlib>=3.8",        # reliability diagrams (Phase 3+)
    "pyarrow>=15.0",          # parquet
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyotei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
